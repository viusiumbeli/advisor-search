services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor
      POSTGRES_DB: advisor_search
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d advisor_search"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    # A prebuilt multi-architecture image, so a reviewer can skip the build entirely:
    #   docker compose pull && docker compose up
    # `build:` stays as the fallback, and is what `docker compose up` uses on its own if the image
    # is not already present locally.
    image: ghcr.io/viusiumbeli/advisor-search:latest
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/advisor_search
      DB_USERNAME: advisor
      DB_PASSWORD: advisor
      # Loads the demo corpus on first start so there is something to search immediately.
      # Seeding is idempotent, so restarts do not duplicate it.
      SPRING_PROFILES_ACTIVE: seed
      # Empty locally, so no credentials are needed. Set it (API_KEY=... docker compose up) and
      # every endpoint except the health probes and the API documentation requires X-API-Key.
      API_KEY: ${API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      # Generous: the first start embeds the whole demo corpus before reporting ready.
      retries: 40
      start_period: 20s

volumes:
  pgdata:
