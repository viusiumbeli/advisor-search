# Deployment configuration for Fly.io. See README, "Deploying it".
#
#   fly launch --no-deploy --copy-config
#   fly secrets set DB_URL=... DB_USERNAME=... DB_PASSWORD=... API_KEY=...
#   fly deploy
#
# The database is any managed Postgres with pgvector and pg_trgm available; the migration creates
# both extensions on first start.

app = "advisor-search"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Loads the demo corpus on first boot so the instance has something to search. Idempotent.
  SPRING_PROFILES_ACTIVE = "seed"
  # Structured logs where a machine reads them; the local compose keeps the human format.
  LOGGING_STRUCTURED_FORMAT_CONSOLE = "ecs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health/readiness"

[[vm]]
  size = "shared-cpu-1x"
  # ONNX Runtime's arenas are native memory on top of the JVM heap. The 256 MB free tier is not
  # enough; this instance settles between 760 and 840 MB resident.
  memory = "2gb"
