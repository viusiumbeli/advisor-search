# The production stack: the published image plus its database, as deployed on the Hetzner VPS.
# See "Deploying it" in ../README.md for the provisioning and copy-up steps.
#
# It is scp'd to /opt/advisor-search/docker-compose.yml on the server rather than run with `-f`,
# so compose auto-loads the sibling .env that holds the generated secrets.
#
# Five deliberate differences from the dev ../docker-compose.yml:
#
#   1. Secrets come from the environment. POSTGRES_PASSWORD and API_KEY are generated on the box
#      into .env; the dev file hardcodes `advisor` because it never faces the internet.
#   2. API_KEY is always set, so the X-API-Key filter is on for every endpoint except the health
#      probes and the API documentation. Locally it defaults to empty, which turns the filter off.
#   3. The db service publishes no port. The dev file's `5432:5432` with a known password must
#      never face the internet, and nothing outside the compose network needs Postgres.
#   4. `restart: unless-stopped` on both services, so the stack survives a reboot of the VPS.
#   5. Structured console logs (ECS JSON) instead of human-readable ones, because on a server the
#      reader is `docker logs` piped into something, not a person watching a terminal.
#
# The api service carries no compose healthcheck: the image declares its own HEALTHCHECK, so
# `docker ps` reports health either way. The db healthcheck stays because `depends_on` needs it.

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: advisor_search
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d advisor_search"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ghcr.io/viusiumbeli/advisor-search:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/advisor_search
      DB_USERNAME: advisor
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: seed
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      API_KEY: ${API_KEY}
    ports:
      - "8080:8080"

volumes:
  pgdata:
