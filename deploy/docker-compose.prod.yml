# The production stack, as deployed on the Hetzner VPS. Provisioning steps are in
# docs/operating-notes.md, "Deployment". Copied to /opt/advisor-search/docker-compose.yml rather
# than run with `-f`, so compose auto-loads the sibling .env holding the generated secrets.
#
# Five deliberate differences from ../docker-compose.yml:
#   1. Secrets from the environment, generated on the box; the dev file hardcodes `advisor`.
#   2. API_KEY always set, so the X-API-Key filter is on. Empty locally, which disables it.
#   3. No published Postgres port — the dev file's 5432 must never face the internet.
#   4. restart: unless-stopped, so the stack survives a reboot.
#   5. ECS JSON logs, because here the reader is `docker logs`, not a person at a terminal.
#
# No compose healthcheck on api: the image declares its own. The db one stays for depends_on.

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: advisor_search
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d advisor_search"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ghcr.io/viusiumbeli/advisor-search:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/advisor_search
      DB_USERNAME: advisor
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: seed
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      API_KEY: ${API_KEY}
    ports:
      - "8080:8080"

volumes:
  pgdata:
