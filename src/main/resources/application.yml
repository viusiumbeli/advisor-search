spring:
  application:
    name: advisor-search
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/advisor_search}
    username: ${DB_USERNAME:advisor}
    password: ${DB_PASSWORD:advisor}
  jackson:
    # The task's OpenAPI fragment uses first_name / client_id / created_at, so the whole API speaks
    # snake_case rather than annotating every field.
    property-naming-strategy: SNAKE_CASE
    # An API decision, not a serializer detail: an absent optional field (a client with no
    # description) is omitted from the JSON rather than sent as an explicit null.
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

embedding:
  model-path: ${EMBEDDING_MODEL_PATH:models/model.onnx}
  tokenizer-path: ${EMBEDDING_TOKENIZER_PATH:models/tokenizer.json}
  # Recorded on every chunk row; changing it without reindexing is a startup failure.
  model-id: all-MiniLM-L6-v2
  # The model's own position-embedding limit. Text longer than this is truncated by the encoder,
  # which is why the chunker keeps every chunk comfortably below it.
  max-tokens: 256
  chunk-tokens: 200
  chunk-overlap-tokens: 30

search:
  default-limit: 10
  max-limit: 50
  # The three floors below are measured, not picked. How, and on what:
  # docs/search-design.md, "Calibrating the cut-offs".
  #
  # Absolute cosine floor. Answers "can the corpus answer this at all?" — nonsense peaks at 0.21 —
  # rather than judging relevance, which the relative floor and fusion do instead.
  semantic-floor: 0.30
  # Relative cosine floor, and the one that decides how long a result page is. True positives never
  # score below 0.76 of the query's best hit, so 0.70 keeps them all and drops the long tail.
  semantic-floor-ratio: 0.70
  # Lexical floor, relative because ts_rank_cd has no absolute scale. Genuine secondary matches
  # score 0.50 to 0.58 of the best hit, incidental ones 0.03 and below; 0.05 sits in that gap.
  keyword-floor-ratio: 0.05

  # pg_trgm's `<%` operator threshold, set per search transaction.
  word-similarity-threshold: 0.5
  # Queries shorter than this (in alphanumeric characters) skip the fuzzy arm: trigram similarity
  # over one or two characters is noise.
  min-fuzzy-query-length: 3
  # How many documents each arm shortlists before fusion — documents in both arms, so the two
  # rankings fusion combines are cut to the same depth. The semantic arm applies it per expansion
  # probe and then keeps each document's best score, so an expanded query can carry more than this
  # into the floors below; what it cannot do is let one long document consume the shortlist.
  candidate-documents: 30
  # Reciprocal rank fusion constant from Cormack et al., SIGIR 2009; also the default in
  # Elasticsearch, OpenSearch and Azure AI Search.
  rrf-k: 60

ingest:
  # The schema carries the same ceiling as a CHECK constraint, and startup rejects a larger value
  # here rather than letting an ingest fail at the insert.
  max-content-length: 100000

api:
  # Empty means no authentication, which is the local docker compose default. The deployed
  # instance sets API_KEY and then every endpoint except the health probes requires X-API-Key.
  key: ${API_KEY:}

logging:
  level:
    com.advisorsearch: INFO
